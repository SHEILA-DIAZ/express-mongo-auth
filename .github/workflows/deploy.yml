name: CI/CD - Render

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validar API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar sintaxis
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src -name '*.js' -print0)

      - name: Validar importaciones del API
        run: node --input-type=module -e "await import('./src/app.js'); console.log('API imports OK');"

  deploy:
    name: Solicitar despliegue en Render
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ejecutar Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo 'Falta configurar el secret RENDER_DEPLOY_HOOK_URL.'
            exit 1
          fi
          curl --fail --silent --show-error --output /dev/null \
            --request POST --get \
            --data-urlencode "ref=$COMMIT_SHA" \
            "$RENDER_DEPLOY_HOOK_URL"
          echo 'Despliegue solicitado. Verificar el resultado en Render.'
